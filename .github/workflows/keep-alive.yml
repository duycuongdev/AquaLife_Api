name: Keep Render Server Alive

on:
  schedule:
    # Chạy mỗi 14 phút (Render free ngủ sau 15 phút nếu không có request)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://aqualife-api.onrender.com
          echo " - Đã ping server để tránh ngủ đông lúc $(date)"
